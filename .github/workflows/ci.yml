name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: interconnection
          # Ephemeral CI DB — no password (trust auth); nothing to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          # Match docker-compose.yml: host 5433 -> container 5432, so the default
          # DATABASE_URL resolves in CI exactly as it does locally.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interconnection"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type check (mypy)
        run: uv run mypy

      # The browser tests (tests/e2e/test_map_app.py) need the website's packages, Chromium,
      # and the data loaded and kept, since the API reads it on its own connections.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the website's packages
        run: npm ci
        working-directory: frontend

      - name: Install Chromium for the browser tests
        run: uv run playwright install --with-deps chromium

      - name: Load the data
        run: uv run python -m interconnection_agent.cli load

      - name: Test (pytest)
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

  api-image:
    # The image Railway builds and runs (backend/Dockerfile). Building it here catches a
    # broken image before a deploy does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build backend

  secret-scan:
    # Fails the build if any commit in the repository's history contains something that
    # looks like a credential (API keys, tokens, private keys). Scans the whole history on
    # every run, not just the new commits: a key committed and later deleted is still public.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
